name: Continuous IAI.tv Articles & Videos Sync

on:
  schedule:
    # Run every 2 hours to catch all new posts and debates as soon as published
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape New Articles
        run: |
          python scraper.py --workers 8

      - name: Sync Video Catalog & Debates
        run: |
          python scripts/build_videos_index.py

      - name: Rebuild Web Reader Data
        run: |
          python scripts/build_reader.py

      - name: Upload Web Reader Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iai-web-reader-dist
          path: dist/
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/'

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            echo "New content detected! Committing and pushing..."
            git add articles/ new_articles/ CATALOG.md articles_index.json baseline_ids.json VIDEOS_CATALOG.md iai_videos.json iai_videos_tracker.csv data/ videos.html dist/ README.md
            git commit -m "Auto-update: sync latest IAI.tv articles and videos [skip ci]"
            git push
          else
            echo "Everything is already up to date. No new articles or videos."
          fi

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync-content
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
