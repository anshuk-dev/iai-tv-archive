<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAI.tv Unpaywalled Archive | 2,180 Articles</title>
  <meta name="description" content="Complete unpaywalled archive and reader of 2,180+ articles from The Institute of Art and Ideas (IAI.tv).">
  
  <!-- Favicon / Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charter:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #f9f9fb;
      --card-bg: #ffffff;
      --text: #1a1a24;
      --text-muted: #626274;
      --border: #e2e4ea;
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --primary-light: #eff6ff;
      --accent: #b45309;
      --tag-bg: #f1f3f7;
      --tag-text: #475569;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-body: 'Charter', Georgia, Cambria, serif;
    }

    [data-theme="dark"] {
      --bg: #0f1117;
      --card-bg: #181b24;
      --text: #e2e5ee;
      --text-muted: #9499ab;
      --border: #282c3c;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #1e293b;
      --accent: #f59e0b;
      --tag-bg: #222634;
      --tag-text: #cbd5e1;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.2s ease, color 0.2s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
    }

    .logo-badge {
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand span.subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 400;
      display: block;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .theme-toggle, .btn-github {
      background: var(--tag-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .theme-toggle:hover, .btn-github:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Container */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* Search & Filter Bar */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-row {
      display: flex;
      gap: 0.75rem;
    }

    .search-input {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .filter-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .select-dropdown {
      padding: 0.55rem 0.85rem;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    .stats-badge {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Articles Grid */
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .article-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .article-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border-color: var(--primary);
    }

    .card-meta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.65rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .card-id {
      font-family: monospace;
      font-weight: 600;
      color: var(--primary);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.65rem;
      color: var(--text);
    }

    .card-author {
      font-size: 0.85rem;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 0.65rem;
    }

    .card-themes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: auto;
      padding-top: 0.85rem;
    }

    .badge-theme {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.72rem;
      padding: 0.2rem 0.55rem;
      border-radius: 5px;
      font-weight: 500;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin: 2rem 0;
      flex-wrap: wrap;
    }

    .btn-page {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-page.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn-page:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-page:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Reader View */
    .reader-container {
      display: none;
      max-width: 820px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem 3rem;
      box-shadow: var(--shadow);
    }

    .reader-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.25rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn-back {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-back:hover {
      background: var(--primary);
      color: white;
    }

    .reader-font-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .font-btn {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .reader-header {
      margin-bottom: 2rem;
    }

    .reader-title {
      font-size: 2.3rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 1rem;
      letter-spacing: -0.5px;
    }

    .reader-subtitle {
      font-size: 1.2rem;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }

    .reader-meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .reader-meta-bar strong {
      color: var(--text);
    }

    .reader-hero-img {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 2.5rem;
      box-shadow: var(--shadow);
    }

    .reader-content {
      font-family: var(--font-body);
      font-size: 1.15rem;
      line-height: 1.85;
      color: var(--text);
    }

    .reader-content p {
      margin-bottom: 1.45rem;
    }

    .reader-content h2, .reader-content h3, .reader-content h4 {
      font-family: var(--font-ui);
      margin-top: 2.25rem;
      margin-bottom: 1rem;
      line-height: 1.3;
      color: var(--text);
    }

    .reader-content h2 { font-size: 1.6rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
    .reader-content h3 { font-size: 1.35rem; }

    .reader-content blockquote {
      border-left: 4px solid var(--primary);
      padding: 0.75rem 1.25rem;
      margin: 1.5rem 0;
      background: var(--tag-bg);
      border-radius: 0 8px 8px 0;
      font-style: italic;
    }

    .reader-content a {
      color: var(--primary);
      text-decoration: underline;
    }

    .reader-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1.5rem 0;
    }

    .reader-footer {
      margin-top: 3.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .original-link {
      color: var(--primary);
      font-size: 0.9rem;
      text-decoration: none;
      font-weight: 600;
    }

    .original-link:hover {
      text-decoration: underline;
    }

    /* Loading Spinner */
    .loading-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    .spinner {
      border: 3px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Footer */
    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .reader-container {
        padding: 1.5rem;
      }
      .reader-title {
        font-size: 1.75rem;
      }
      .articles-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="brand" onclick="goHome()">
        <span class="logo-badge">IAI.TV</span>
        <div>
          <h1>Archive &amp; Reader</h1>
          <span class="subtitle">2,180 Unpaywalled Articles &bull; Daily Sync</span>
        </div>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
          🌙 Dark Mode
        </button>
        <a href="https://github.com/anshuk-dev/iai-tv-archive" target="_blank" class="btn-github">
          <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          GitHub Repo
        </a>
      </div>
    </div>
  </header>

  <main>
    <!-- Catalog View -->
    <div id="catalogView">
      <div class="controls-panel">
        <div class="search-row">
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search 2,180 articles by title, author, themes, or keyword..."
            oninput="handleSearch()"
          />
        </div>
        <div class="filter-row">
          <div class="filter-group">
            <select id="themeSelect" class="select-dropdown" onchange="handleFilter()">
              <option value="">All Themes &amp; Categories</option>
            </select>
            <select id="sortSelect" class="select-dropdown" onchange="handleFilter()">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="alpha">Title (A - Z)</option>
              <option value="author">Author (A - Z)</option>
            </select>
          </div>
          <div class="stats-badge" id="statsText">Loading archive index...</div>
        </div>
      </div>

      <div id="articlesGrid" class="articles-grid">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading 2,180 articles from database...</p>
        </div>
      </div>

      <div id="pagination" class="pagination"></div>
    </div>

    <!-- Reader View -->
    <div id="readerView" class="reader-container">
      <div class="reader-toolbar">
        <button class="btn-back" onclick="goHome()">
          &larr; Back to Articles
        </button>
        <div class="reader-font-controls">
          <button class="font-btn" onclick="adjustFontSize(-1)">A-</button>
          <button class="font-btn" onclick="adjustFontSize(1)">A+</button>
        </div>
      </div>

      <div class="reader-header">
        <h1 id="readerTitle" class="reader-title"></h1>
        <div id="readerSubtitle" class="reader-subtitle"></div>
        <div id="readerMeta" class="reader-meta-bar"></div>
      </div>

      <img id="readerHeroImg" class="reader-hero-img" style="display:none;" alt="Header Image" />

      <article id="readerContent" class="reader-content"></article>

      <div class="reader-footer">
        <button class="btn-back" onclick="goHome()">&larr; Back to Catalog</button>
        <a id="originalSourceLink" href="#" target="_blank" class="original-link">View Original on IAI.tv &nearr;</a>
      </div>
    </div>
  </main>

  <footer>
    <p>IAI.tv Unpaywalled Archive &bull; Automatically updated every 6 hours via GitHub Actions &bull; Hosted on GitHub Pages</p>
  </footer>

  <script>
    let allArticles = [];
    let filteredArticles = [];
    let currentPage = 1;
    const PAGE_SIZE = 24;
    let currentFontSize = 1.15;

    // Theme Management
    function initTheme() {
      const saved = localStorage.getItem('iai_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      setTheme(saved);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('iai_theme', theme);
      const btn = document.getElementById('themeToggleBtn');
      if (btn) {
        btn.innerHTML = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(current === 'dark' ? 'light' : 'dark');
    }

    // Font size control in Reader
    function adjustFontSize(delta) {
      currentFontSize = Math.max(0.9, Math.min(1.6, currentFontSize + (delta * 0.1)));
      const content = document.getElementById('readerContent');
      if (content) {
        content.style.fontSize = `${currentFontSize}rem`;
      }
    }

    // Load Database
    async function loadArticles() {
      try {
        const resp = await fetch('./articles_index.json');
        if (!resp.ok) throw new Error('Failed to load articles index');
        allArticles = await resp.json();
        
        populateThemesDropdown(allArticles);
        checkRoute();
        window.addEventListener('hashchange', checkRoute);
      } catch (err) {
        console.error(err);
        document.getElementById('articlesGrid').innerHTML = `
          <div class="loading-state" style="grid-column: 1 / -1;">
            <p style="color:#ef4444; font-weight:600;">Failed to load article index.</p>
            <p style="font-size:0.9rem; margin-top:0.5rem;">${err.message}</p>
          </div>
        `;
      }
    }

    function populateThemesDropdown(articles) {
      const themeSet = new Set();
      articles.forEach(a => {
        if (a.themes) {
          a.themes.split(',').forEach(t => {
            const clean = t.trim();
            if (clean && clean !== 'None') themeSet.add(clean);
          });
        }
      });

      const select = document.getElementById('themeSelect');
      const sorted = Array.from(themeSet).sort();
      sorted.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
      });
    }

    // Routing
    function checkRoute() {
      const hash = window.location.hash;
      if (hash.startsWith('#article=')) {
        const slug = hash.replace('#article=', '');
        openArticle(slug);
      } else {
        showCatalog();
      }
    }

    function goHome() {
      window.location.hash = '';
      showCatalog();
    }

    function showCatalog() {
      document.getElementById('catalogView').style.display = 'block';
      document.getElementById('readerView').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      applyFilterAndRender();
    }

    // Search & Filtering
    function handleSearch() {
      currentPage = 1;
      applyFilterAndRender();
    }

    function handleFilter() {
      currentPage = 1;
      applyFilterAndRender();
    }

    function applyFilterAndRender() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const theme = document.getElementById('themeSelect').value;
      const sort = document.getElementById('sortSelect').value;

      filteredArticles = allArticles.filter(a => {
        const matchQ = !q || (
          (a.title && a.title.toLowerCase().includes(q)) ||
          (a.author && a.author.toLowerCase().includes(q)) ||
          (a.themes && a.themes.toLowerCase().includes(q)) ||
          (a.id && a.id.includes(q))
        );
        const matchTheme = !theme || (a.themes && a.themes.includes(theme));
        return matchQ && matchTheme;
      });

      // Sorting
      filteredArticles.sort((a, b) => {
        if (sort === 'newest') return (parseInt(b.id) || 0) - (parseInt(a.id) || 0);
        if (sort === 'oldest') return (parseInt(a.id) || 0) - (parseInt(b.id) || 0);
        if (sort === 'alpha') return (a.title || '').localeCompare(b.title || '');
        if (sort === 'author') return (a.author || '').localeCompare(b.author || '');
        return 0;
      });

      document.getElementById('statsText').textContent = 
        `Showing ${filteredArticles.length.toLocaleString()} of ${allArticles.length.toLocaleString()} articles`;

      renderGrid();
      renderPagination();
    }

    function renderGrid() {
      const grid = document.getElementById('articlesGrid');
      grid.innerHTML = '';

      if (filteredArticles.length === 0) {
        grid.innerHTML = `
          <div class="loading-state" style="grid-column: 1 / -1;">
            <p>No matching articles found.</p>
          </div>
        `;
        return;
      }

      const start = (currentPage - 1) * PAGE_SIZE;
      const paged = filteredArticles.slice(start, start + PAGE_SIZE);

      paged.forEach(art => {
        const card = document.createElement('div');
        card.className = 'article-card';
        card.onclick = () => {
          window.location.hash = `#article=${art.slug}`;
        };

        const themesHtml = art.themes && art.themes !== 'None'
          ? art.themes.split(',').slice(0, 2).map(t => `<span class="badge-theme">${t.trim()}</span>`).join('')
          : '';

        card.innerHTML = `
          <div>
            <div class="card-meta-top">
              <span class="card-id">#${art.id || ''}</span>
              <span>${art.date || ''}</span>
            </div>
            <h2 class="card-title">${art.title || art.slug}</h2>
            <div class="card-author">${art.author ? 'By ' + art.author : ''}</div>
          </div>
          <div class="card-themes">
            ${themesHtml}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredArticles.length / PAGE_SIZE);
      const container = document.getElementById('pagination');
      container.innerHTML = '';

      if (totalPages <= 1) return;

      const prevBtn = document.createElement('button');
      prevBtn.className = 'btn-page';
      prevBtn.textContent = '← Prev';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { currentPage--; renderGrid(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      container.appendChild(prevBtn);

      // Page numbers logic (max 5 buttons)
      let startPage = Math.max(1, currentPage - 2);
      let endPage = Math.min(totalPages, startPage + 4);
      if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

      for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement('button');
        btn.className = `btn-page ${i === currentPage ? 'active' : ''}`;
        btn.textContent = i;
        btn.onclick = () => { currentPage = i; renderGrid(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        container.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'btn-page';
      nextBtn.textContent = 'Next →';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { currentPage++; renderGrid(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      container.appendChild(nextBtn);
    }

    // Reader View
    async function openArticle(slug) {
      document.getElementById('catalogView').style.display = 'none';
      const reader = document.getElementById('readerView');
      reader.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const contentEl = document.getElementById('readerContent');
      contentEl.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Fetching article content...</p></div>';

      try {
        const resp = await fetch(`./articles/${slug}.md`);
        if (!resp.ok) throw new Error('Article markdown file not found');
        const rawMd = await resp.text();

        // Parse frontmatter
        const fmMatch = rawMd.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
        let meta = {};
        let bodyMd = rawMd;

        if (fmMatch) {
          const fmText = fmMatch[1];
          bodyMd = fmMatch[2];
          fmText.split('\n').forEach(line => {
            const m = line.match(/^([a-zA-Z0-9_-]+):\s*"(.*)"$/);
            if (m) meta[m[1]] = m[2];
          });
        }

        // Render Header & Meta
        document.getElementById('readerTitle').textContent = meta.title || slug;
        
        const subEl = document.getElementById('readerSubtitle');
        if (meta.subtitle) {
          subEl.textContent = meta.subtitle;
          subEl.style.display = 'block';
        } else {
          subEl.style.display = 'none';
        }

        const metaParts = [];
        if (meta.author) metaParts.push(`<strong>By ${meta.author}</strong>`);
        if (meta.date) metaParts.push(`<span>${meta.date}</span>`);
        if (meta.read_time) metaParts.push(`<span>${meta.read_time}</span>`);
        if (meta.word_count) metaParts.push(`<span>${meta.word_count}</span>`);
        if (meta.themes && meta.themes !== 'None') metaParts.push(`<span>Themes: <em>${meta.themes}</em></span>`);

        document.getElementById('readerMeta').innerHTML = metaParts.join(' &bull; ');

        // Hero Image
        const heroImg = document.getElementById('readerHeroImg');
        if (meta.header_image) {
          heroImg.src = meta.header_image;
          heroImg.style.display = 'block';
        } else {
          heroImg.style.display = 'none';
        }

        // Original Source Link
        const srcLink = document.getElementById('originalSourceLink');
        srcLink.href = meta.source_url || `https://iai.tv/articles/${slug}`;

        // Render Markdown Body to HTML
        // Strip out redundant leading title or images already shown in header
        let cleanMd = bodyMd
          .replace(/^#\s+.*$/m, '')
          .replace(/^!\[.*?\]\(.*?\)\s*$/m, '')
          .replace(/^\*.*?\*\s*$/m, '')
          .replace(/^---/m, '')
          .trim();

        contentEl.innerHTML = marked.parse(cleanMd);

      } catch (err) {
        console.error(err);
        contentEl.innerHTML = `
          <div class="loading-state">
            <p style="color:#ef4444; font-weight:600;">Failed to render article.</p>
            <p style="font-size:0.9rem; margin-top:0.5rem;">${err.message}</p>
          </div>
        `;
      }
    }

    // Initialize
    initTheme();
    loadArticles();
  </script>
</body>
